[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "sinuo-platform"
version = "0.1.0"
description = "Sinuo backend construction scaffold"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0.36,<3",
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "pillow>=10.4,<12",
  "pypdfium2>=4.30,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/sinuo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers", "-m", "not live_model"]
markers = [
  "integration: exercises real Alembic migrations or the HTTP app against SQLite",
  "concurrency: competes multiple connections or tasks for the same resource",
  "recovery: verifies takeover, rollback or retry after a failure",
  "live_model: performs paid model calls; excluded unless selected with -m live_model",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

