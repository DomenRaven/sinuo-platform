        box.append(el("strong", "", "本页内容："));
        const pills = el("div", "legend");
        Object.keys(counts).forEach(function (duty) {
          pills.append(rolePill(duty));
          pills.append(el("span", "meta", "×" + counts[duty] + " "));
        });
        box.append(pills);
        panel.append(box);
      }
      panel.append(
        el("div", "rs-note", "勾选将用于下一次检查：纳入邻页或作品，或跳过理论库与方法卡。"),
      );
      return panel;
    }

    // 排除项：本次跳过理论库 / 方法卡库（T13a exclusions）。
    function exclusionChecks() {
      const group = el("div", "rs-group");
      group.append(el("div", "rs-group-title", "本次跳过"));
      [["theory", "理论库"], ["methods", "方法卡"]].forEach(function (pair) {
        group.append(
          checkRow(pair[1], readSet.exclusions.indexOf(pair[0]) !== -1, function (checked) {
            if (checked) {
              if (readSet.exclusions.indexOf(pair[0]) === -1) readSet.exclusions.push(pair[0]);
            } else {
              readSet.exclusions = readSet.exclusions.filter(function (key) { return key !== pair[0]; });
            }
          }),
        );
      });
      return group;
    }

    // 一个可勾选行。
    function checkRow(label, checked, onChange) {
      const checkbox = el("input");
      checkbox.type = "checkbox";
      checkbox.checked = checked;
      checkbox.addEventListener("change", function () { onChange(checkbox.checked); });
      const row = el("label", "rs-check");
      row.append(checkbox, el("span", "", label));
      return row;
    }

    // 拉读集候选，渲染邻页版本 / 作品版本，证据锚点与方法卡作说明。
    async function loadScopeOptions(scopeBox, reading) {
      const result = await api("/api/v1/projects/" + encodeURIComponent(reading.project_id) + "/context-scope");
      if (!result.ok) {
        scopeBox.append(el("p", "rs-empty", "读取范围暂不可用（" + result.message + "）。"));
        return;
      }
      const scope = result.data || {};
      const adjacent = (scope.page_versions || []).filter(function (pv) {
        return pv.page_version_id !== reading.head_version_id;
      });
      if (adjacent.length) {
        const group = el("div", "rs-group");
        group.append(el("div", "rs-group-title", "纳入邻页"));
        adjacent.forEach(function (pv) {
          group.append(
            checkRow(pv.title + " · 第 " + pv.version_no + " 版", readSet.pageVersionIds.indexOf(pv.page_version_id) !== -1, function (checked) {
              if (checked) {
                if (readSet.pageVersionIds.indexOf(pv.page_version_id) === -1) readSet.pageVersionIds.push(pv.page_version_id);
              } else {
                readSet.pageVersionIds = readSet.pageVersionIds.filter(function (id) { return id !== pv.page_version_id; });
              }
            }),
          );
        });
        scopeBox.append(group);
      }
      const artifacts = scope.artifact_versions || [];
      if (artifacts.length) {
        const group = el("div", "rs-group");
        group.append(el("div", "rs-group-title", "纳入作品"));
        artifacts.forEach(function (av) {
          const row = el("label", "rs-check");
          const checkbox = el("input");
          checkbox.type = "checkbox";
          checkbox.checked = readSet.artifactVersionIds.indexOf(av.artifact_version_id) !== -1;
          if (!av.ai_processing_allowed) {
            checkbox.disabled = true;
            row.classList.add("rs-disabled");
          } else {
            checkbox.addEventListener("change", function () {
              if (checkbox.checked) {
                if (readSet.artifactVersionIds.indexOf(av.artifact_version_id) === -1) readSet.artifactVersionIds.push(av.artifact_version_id);
              } else {
                readSet.artifactVersionIds = readSet.artifactVersionIds.filter(function (id) { return id !== av.artifact_version_id; });
              }
            });
          }
          row.append(checkbox, el("span", "", av.title + " · 第 " + av.version_no + " 版" + (av.ai_processing_allowed ? "" : "（不可纳入）")));
          group.append(row);
        });
        scopeBox.append(group);
      }
      const anchors = scope.evidence_anchors || [];
      if (anchors.length) {
        scopeBox.append(el("div", "rs-hint", "证据锚点 " + anchors.length + " 条。"));
      }
      const cards = scope.method_cards || [];
      if (cards.length) {
        scopeBox.append(el("div", "rs-hint", "方法卡 " + cards.length + " 张。"));
      }
      if (scope.has_hidden) {
        scopeBox.append(el("div", "rs-hint", "部分内容按权限隐藏。"));
      }
    }

    function intentRules() {
      const box = el("div", "intent-rule");
      box.append(el("strong", "", "提问会由对应智能体处理："));
      QUICK_ACTIONS.forEach(function (action) {
        const line = el("div", "rule-line");
        line.append(el("span", "", "「" + action.intent + "」 → "));
        action.roles.forEach(function (role) {
          line.append(rolePill(role));
        });
        box.append(line);
      });
      return box;
    }

    function quickActions(reading, runSlot, cardSlot) {
      const box = el("div", "quick-actions");
      QUICK_ACTIONS.forEach(function (action) {
        const button = el("button", "quick-card");
        button.type = "button";
        button.append(
          el("span", "q-name", action.label),
          el("span", "q-hint", action.hint),
        );
        const roles = el("span", "q-roles");
        action.roles.forEach(function (role) { roles.append(rolePill(role)); });
        button.append(roles);
        if (!reading.head_version_id) {
          button.disabled = true;
          button.title = "先确认这一版，再提问。";
        } else {
          button.addEventListener("click", function () {
            askNext(button, reading, runSlot, cardSlot, action.intent, action.label);
          });
        }
        box.append(button);
      });
      if (!reading.head_version_id) {
        box.append(el("p", "meta", "先确认这一版，再提问。"));
      }
      return box;
    }

    async function askNext(button, reading, runSlot, cardSlot, intent, label) {
      const before = reading.draft ? reading.draft.content_revision : null;
      button.disabled = true;
      const original = button.querySelector(".q-name");
      if (original) original.textContent = label + "…";
      const started = await api("/api/v1/projects/" + encodeURIComponent(reading.project_id) + "/agent-runs", {
        method: "POST",
        headers: writeHeaders(crypto.randomUUID()),
        body: JSON.stringify({
          intent: intent,
          input_mode: "confirmed",
          page_version_id: reading.head_version_id,
          page_version_ids: readSet.pageVersionIds,
          artifact_version_ids: readSet.artifactVersionIds,
          exclusions: readSet.exclusions,
        }),
      });
      button.disabled = false;
      if (original) original.textContent = label;
      if (!started.ok) {
        runSlot.prepend(alertBox(started.message));
        return;
      }
      const run = await api("/api/v1/agent-runs/" + encodeURIComponent(started.data.run_id));
      if (!run.ok) {
        runSlot.append(alertBox(run.message));
      } else {
        const tools = await fetchToolCalls(started.data.run_id);
        renderRun(runSlot, run.data, tools);
      }
      await loadCandidates(cardSlot, reading);
      const again = await api("/api/v1/pages/" + encodeURIComponent(reading.page_id) + "/draft");
      if (again.ok) {
        const after = again.data.draft ? again.data.draft.content_revision : null;
        const same = before === after;
        runSlot.append(el("p", "meta", same ? "运行完成。" : "运行完成，草稿已更新到 R" + after + "。"));
      }
    }

    async function fetchToolCalls(runId) {
      // 从 SSE 事件流回放里提取工具调用步骤（tool.completed）
      try {
        const response = await fetch("/api/v1/agent-runs/" + encodeURIComponent(runId) + "/events", {
          headers: { Accept: "text/event-stream" },
          credentials: "same-origin",
        });
        if (!response.ok) return [];
        const text = await response.text();
        const tools = [];
        text.split("\n\n").forEach(function (frame) {
          if (frame.indexOf("event: tool.completed") === -1) return;
          const dataLine = frame.split("\n").find(function (line) { return line.indexOf("data: ") === 0; });
          if (!dataLine) return;
          try {
            const event = JSON.parse(dataLine.slice(6));
            const payload = event.payload || {};
            if (payload.name) tools.push({ name: payload.name, status: payload.status });
          } catch (_error) { /* 跳过无法解析的帧 */ }
        });
        return tools;
      } catch (_error) {
        return [];
      }
    }

    function toolChain(tools) {
      if (!tools || !tools.length) return null;
      const box = el("div", "tool-chain");
      tools.forEach(function (tool, index) {
        if (index > 0) box.append(el("span", "tool-arrow", "→"));
        const chip = el("span", "tool-chip " + (tool.status || "completed"));
        chip.append(
          el("span", "tool-name", TOOL_LABEL[tool.name] || tool.name),
          el("span", "", TOOL_STATUS_LABEL[tool.status] || tool.status),
        );
        box.append(chip);
      });
      return box;
    }

    function renderRun(slot, run, tools) {
      clear(slot);
      const flow = el("div", "run-flow");
      // ① 用户意图
      const intent = el("div", "run-intent", "你的提问：", el("span", "", run.intent || "（空）"));
      flow.append(intent);
      // ② 工具调用链（ReAct 循环里的"行动"）
      const chain = toolChain(tools);
      if (chain) {
        flow.append(el("div", "section-label", "工具调用链"));
        flow.append(chain);
      }
      // ③ 角色卡（按依赖次序：证据 → 批评）
      run.duties.forEach(function (step, index) {
        if (index > 0) flow.append(el("div", "dep-arrow", "↓ 上一步的结果"));
        flow.append(roleCard(step));
      });
      slot.append(
        el("h2", "", "这次运行"),
        el("p", "", run.status_label || ("状态：" + run.status)),
      );
      if (run.opening_gaps && run.opening_gaps.length) {
        slot.append(el("p", "", "本次记录的缺口"));
        run.opening_gaps.forEach(function (gap) { slot.append(el("p", "gap-item", gap)); });
      }
      slot.append(flow);
    }

    function roleCard(step) {
      const role = step.role;
      const card = el("div", "role-card role-" + role);
      const head = el("div", "r-head");
      head.append(
        el("span", "r-name", step.role_label || role),
        el("span", "r-status", step.status_label || ("状态：" + step.status)),
      );
      card.append(head);
      if (step.summary) card.append(el("p", "r-summary", step.summary));
      // 来源（可溯源）
      const sources = step.reads || [];
      if (sources.length) {
        const box = el("div", "r-sources", el("strong", "", "依据："));
        sources.forEach(function (item) {
          if (item.target === "restricted") {
            box.append(el("span", "source-item", "受限内容已隐藏"));
          } else if (item.label) {
            if (item.target === "artifact_version" && item.object_id) {
              const link = el("a", "source-item", "· " + item.label);
              link.href = "/api/v1/artifact-versions/" + encodeURIComponent(item.object_id) + "/content";
              box.append(link);
            } else {
              box.append(el("span", "source-item", "· " + item.label));
            }
          } else {
            box.append(el("span", "source-item", "· 一条记录"));
          }
        });
        card.append(box);
      }
      // 缺口
      const gaps = step.gaps || [];
      if (gaps.length) {
        const box = el("div", "r-gaps", el("strong", "", "缺口："));
        gaps.forEach(function (gap) { box.append(el("span", "gap-item", "· " + gap)); });
        card.append(box);
      }
      if (step.error) card.append(el("p", "", "失败：" + step.error));
      return card;
    }

    async function loadCandidates(slot, reading) {
      const result = await api("/api/v1/projects/" + encodeURIComponent(reading.project_id) + "/candidates");
      clear(slot);
      slot.append(el("h2", "", "待确认"));
      if (!result.ok) {
        slot.append(alertBox(result.message));
        return;
      }
      const pending = result.data.candidates.filter(function (item) { return item.status === "pending"; });
      if (!pending.length) {
        slot.append(el("p", "", "暂无可确认的内容。"));
        return;
      }
      pending.forEach(function (card) { slot.append(candidateCard(card, reading, slot)); });
    }

    function candidateCard(card, reading, slot) {
      const block = el("article", "card");
      block.append(
        el("div", "section-label", "待确认"),
        el("h3", "", card.status_label || "待确认"),
      );
      if (card.action_label) block.append(el("p", "", card.action_label));
      if (card.edge_kind_label) block.append(el("p", "edge-kind-note", "关系类型：" + card.edge_kind_label));
      if (card.summary) block.append(el("p", "", card.summary));
      if (card.title) block.append(el("p", "", "将创建：" + card.title));
      if (card.gaps && card.gaps.length) {
        const gapBox = el("div");
        gapBox.append(el("strong", "", "缺口："));
        card.gaps.forEach(function (gap) { gapBox.append(el("p", "gap-item", gap)); });
        block.append(gapBox);
      }
      if (!card.preview_ready) {
        block.append(el("p", "", "这是一条过程记录，无需确认。"));
        return block;
      }
      const preview = el("button", "", "预览");
      preview.type = "button";
      const reject = el("button", "quiet", "拒绝");
      reject.type = "button";
      const holder = el("div");
      preview.addEventListener("click", function () { previewCard(card, reading, holder, slot); });
      reject.addEventListener("click", function () { rejectCard(card, reading, slot); });
      block.append(preview, reject, holder);
      return block;
    }

    function previewBody(card, reading) {
      const body = {
        expected_page_version_id: reading.head_version_id,
        expected_draft_content_revision: reading.draft ? reading.draft.content_revision : null,
      };
      return body;
    }

    async function previewCard(card, reading, holder, slot) {
      clear(holder);
      const result = await api("/api/v1/candidates/" + encodeURIComponent(card.candidate_id) + "/preview", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-CSRF-Token": csrf },
        body: JSON.stringify(previewBody(card, reading)),
      });
      if (!result.ok) {
        holder.append(alertBox(result.message));
        return;
      }
      holder.append(el("p", "", "确认前的预览。"));
      const affected = result.data.affected_objects || [];
      if (!affected.length) holder.append(el("p", "", "即将改动的对象："));
      affected.forEach(function (item) {
        const bits = [];
        Object.keys(item).forEach(function (key) { bits.push(key + " " + item[key]); });
        holder.append(el("p", "meta", bits.join("，")));
      });
      const confirm = el("button", "", "确认");
      confirm.type = "button";
      confirm.addEventListener("click", function () {
        commitCard(card, reading, result.data, confirm, slot);
      });
      holder.append(confirm);
    }

    async function commitCard(card, reading, preview, button, slot) {
      const before = reading.draft ? reading.draft.content_revision : null;
      button.disabled = true;
      const body = previewBody(card, reading);
      body.preview_id = preview.preview_id;
      body.preview_hash = preview.preview_hash;
      if (!body.expected_page_version_id) {
        button.disabled = false;
        slot.prepend(alertBox("先确认这一版，再提交。"));
        return;
      }
      const result = await api("/api/v1/candidates/" + encodeURIComponent(card.candidate_id) + "/commit", {
        method: "POST",
        headers: writeHeaders(crypto.randomUUID()),
        body: JSON.stringify(body),
      });
      if (!result.ok) {
        button.disabled = false;
        slot.prepend(alertBox(result.message));
        return;
      }
      if (result.data.page_id && result.data.page_id !== reading.page_id) {
        sessionStorage.setItem("sinuo-arrived", result.data.page_id);
        location.assign("/projects/" + encodeURIComponent(reading.project_id) + "/pages/" + encodeURIComponent(result.data.page_id));
        return;
      }
      const again = await api("/api/v1/pages/" + encodeURIComponent(reading.page_id) + "/draft");
      const after = again.ok && again.data.draft ? again.data.draft.content_revision : null;
      slot.prepend(alertBox(before === after ? "已确认。" : "已确认，草稿更新到 R" + after + "。"));
      loadCandidates(slot, reading);
    }

    async function rejectCard(card, reading, slot) {
      const before = reading.draft ? reading.draft.content_revision : null;
      const result = await api("/api/v1/candidates/" + encodeURIComponent(card.candidate_id) + "/reject", {
        method: "POST",
        headers: writeHeaders(crypto.randomUUID()),
        body: JSON.stringify({}),
      });
      const again = await api("/api/v1/pages/" + encodeURIComponent(reading.page_id) + "/draft");
      const after = again.ok && again.data.draft ? again.data.draft.content_revision : null;
      if (!result.ok) {
        slot.prepend(alertBox(result.message));
        return;
      }
      slot.prepend(alertBox(before === after ? "已拒绝。" : "已拒绝，草稿更新到 R" + after + "。"));
      loadCandidates(slot, reading);
    }

    async function show() {
      const session = await api("/api/v1/session");
      if (!session.ok) {
        renderLogin();
        return;
      }
      csrf = session.data.csrf_token;
      renderAccount(session.data);
      const here = route();
      renderTopnav(here);
      const main = document.getElementById("main");
      if (location.pathname === "/") {
        location.replace("/projects");
        return;
      }
      if (here.name === "missing") {
        clear(main);
        main.append(el("h1", "", "页面不存在"), el("p", "", "回到项目列表。"));
        const back = el("a", "button", "回到项目");
        back.href = "/projects";
        main.append(back);
        return;
      }
      if (here.name === "shelf") {
        const listed = await api("/api/v1/projects");
        if (listed.status === 401) return renderLogin();
        if (!listed.ok) {
          clear(main);
          main.append(alertBox(listed.message));
          return;
        }
        renderShelf(listed.data.projects);
        return;
      }
      if (here.name === "stages") {
        const reading = await api("/api/v1/projects/" + encodeURIComponent(here.projectId) + "/stages");
        if (reading.status === 401) return renderLogin();
        if (!reading.ok) {
          clear(main);
          main.append(alertBox(reading.message));
          return;
        }
        renderStages(reading.data);
        return;
      }
      const draft = await api("/api/v1/pages/" + encodeURIComponent(here.pageId) + "/draft");
      const stages = await api("/api/v1/projects/" + encodeURIComponent(here.projectId) + "/stages");
      if (draft.status === 401 || stages.status === 401) return renderLogin();
      if (!draft.ok) {
        clear(main);
        main.append(alertBox(draft.message));
        return;
      }
      let stageName = "未命名阶段";
      let projectTitle = "这个项目";
      if (stages.ok) {
        projectTitle = stages.data.title;
        const found = stages.data.stages.find(function (stage) {
          return stage.stage_id === draft.data.stage_id;
        });
        if (found && found.name) stageName = found.name;
      }
      renderPage(draft.data, stageName, projectTitle);
    }

    show();
  </script>
</body>
</html>
